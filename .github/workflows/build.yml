name: Compilar APK y AAB
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Descomprimir
        run: unzip -q proyecto.zip -d work
      - name: Compilar APK de prueba (debug)
        working-directory: work
        run: gradle assembleDebug --stacktrace
      - name: Preparar la clave de subida (si existe en los secrets)
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "firmado=si" >> "$GITHUB_OUTPUT"
          else
            echo "firmado=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Compilar AAB y APK firmados para Google Play
        if: steps.firma.outputs.firmado == 'si'
        working-directory: work
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: USB-Informer-apk-debug
          path: work/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: steps.firma.outputs.firmado == 'si'
        with:
          name: USB-Informer-google-play-aab
          path: work/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: steps.firma.outputs.firmado == 'si'
        with:
          name: USB-Informer-apk-release
          path: work/app/build/outputs/apk/release/app-release.apk
